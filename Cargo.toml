[package]
name = "katana-desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
dirs = "7.0.0"
flate2 = "1.1.10"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tao = "0.37.1"
ureq = "3.4.2"
wry = "0.57.0"

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.17"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[build-dependencies]
winresource = "0.1.31"
