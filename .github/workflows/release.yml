# Push a tag vX.Y.Z (see `make release`) to build every package (.flatpak included), publish a GitHub release
# with them attached, and update the AUR packages, the Homebrew tap and the snap. Tags with a "-"
# (v1.2.0-rc1) make a prerelease, skip the AUR and the tap, and put the snap on its candidate channel.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-22.04, arch: x86_64, debarch: amd64 }
          - { runner: ubuntu-22.04-arm, arch: aarch64, debarch: arm64 }
    # the oldest supported Ubuntu, so the binaries run on any glibc since 2.35
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag matches Cargo.toml
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME, but Cargo.toml says $v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev nfpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --release
      - run: cargo build --locked --release
      - run: |
          make install-desktop PREFIX=/usr DESTDIR=stage
          install -Dm644 LICENSE -t stage/usr/share/licenses/katana-desktop
          # katana-tui is packaged on its own
          make install-tui PREFIX=/usr DESTDIR=stage-tui
          install -Dm644 LICENSE -t stage-tui/usr/share/licenses/katana-tui
      - name: Package
        env:
          ARCH: ${{ matrix.debarch }}
        run: |
          mkdir -p dist
          tar -czf "dist/katana-desktop-$VERSION-linux-${{ matrix.arch }}.tar.gz" -C stage usr
          nfpm package -f packaging/nfpm.yaml -p deb -t dist/
          nfpm package -f packaging/nfpm.yaml -p rpm -t dist/
          tar -czf "dist/katana-tui-$VERSION-linux-${{ matrix.arch }}.tar.gz" -C stage-tui usr
          nfpm package -f packaging/nfpm-tui.yaml -p deb -t dist/
          nfpm package -f packaging/nfpm-tui.yaml -p rpm -t dist/
      - uses: actions/upload-artifact@v5
        with: { name: 'linux-${{ matrix.arch }}', path: dist/* }

  windows:
    # cross-built with MinGW + NSIS, the same as `make windows` locally
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64 nsis zip
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-gnu }
      - uses: Swatinem/rust-cache@v2
      - run: make windows windows-tui
      - uses: actions/upload-artifact@v5
        with: { name: windows, path: 'dist/*' }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'aarch64-apple-darwin,x86_64-apple-darwin' }
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/bundle-macos.sh universal
      - name: Make the .dmg
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          mkdir -p target/dmg dist
          cp -R "target/Katana Desktop.app" target/dmg/
          ln -s /Applications target/dmg/Applications
          hdiutil create -volname "Katana Desktop" -srcfolder target/dmg -format UDZO "dist/KatanaDesktop-$v-macos-universal.dmg"
      - name: Package katana-tui
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --target "$t" --no-default-features --features tui --bin katana-tui
          done
          mkdir -p target/tui dist
          lipo -create -output target/tui/katana-tui \
            target/aarch64-apple-darwin/release/katana-tui target/x86_64-apple-darwin/release/katana-tui
          # ad-hoc signature, as for the app: Apple silicon doesn't run unsigned code
          codesign --force -s - target/tui/katana-tui
          cp LICENSE target/tui/
          tar -czf "dist/katana-tui-$v-macos-universal.tar.gz" -C target/tui katana-tui LICENSE
      - uses: actions/upload-artifact@v5
        with: { name: macos, path: 'dist/*' }

  flatpak:
    # .flatpak bundles of the binaries the linux job built; installing one pulls its runtime from Flathub
    needs: linux
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        app:
          - { pkg: katana-desktop, id: pro.buryakov.KatanaDesktop, image: gnome-51 }
          - { pkg: katana-tui, id: pro.buryakov.KatanaTui, image: freedesktop-26.08 }
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:${{ matrix.app.image }}
      options: --privileged
    steps:
      - uses: actions/checkout@v5
      - id: unpack
        run: |
          case "$(uname -m)" in aarch64) arch=aarch64 ;; *) arch=x86_64 ;; esac
          v="${GITHUB_REF_NAME#v}"
          echo "arch=$arch" >> "$GITHUB_OUTPUT"
          echo "tarball=${{ matrix.app.pkg }}-$v-linux-$arch.tar.gz" >> "$GITHUB_OUTPUT"
          echo "bundle=${{ matrix.app.pkg }}-$v-linux-$arch.flatpak" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v5
        with: { name: 'linux-${{ steps.unpack.outputs.arch }}', path: linux }
      - run: mkdir stage && tar -xzf "linux/${{ steps.unpack.outputs.tarball }}" -C stage
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/${{ matrix.app.id }}.yml
          bundle: ${{ steps.unpack.outputs.bundle }}
          arch: ${{ steps.unpack.outputs.arch }}
          branch: stable
          cache-key: flatpak-builder-${{ matrix.app.pkg }}-${{ steps.unpack.outputs.arch }}-${{ github.sha }}
          upload-artifact: false
      - uses: actions/upload-artifact@v5
        with: { name: 'flatpak-${{ matrix.app.pkg }}-${{ steps.unpack.outputs.arch }}', path: '${{ steps.unpack.outputs.bundle }}' }

  release:
    needs: [linux, flatpak, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with: { path: dist, merge-multiple: true }
      - run: cd dist && sha256sum * > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes --title "Katana Desktop ${GITHUB_REF_NAME#v}" \
            $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)

  aur:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/publish_aur.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit

  homebrew:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/publish_homebrew.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit

  snap:
    needs: release
    uses: ./.github/workflows/publish_snap.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit
