# Builds packaging/snap/snapcraft.yaml for a release tag and uploads it to the Snap Store: releases
# to stable, release candidates (1.2.0-rc1) to candidate. release.yml calls it once the GitHub
# release exists; run it by hand to (re)publish one: gh workflow run publish_snap.yml -f version=1.2.3
# (add -f channel=edge to try a build without touching stable)
name: Publish to Snap Store

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish (e.g. 1.2.3)"
        required: true
      channel:
        description: "Channel instead of stable/candidate, e.g. edge to try a build first"
        required: false

jobs:
  publish:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    # lists the publish under the repository's Deployments
    environment:
      name: snapcraft
      url: https://snapcraft.io/katana-desktop
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@v5
      - name: Fill in the version
        id: version
        run: |
          version="${RELEASE_VERSION#v}"
          sed -e "s/^version: .*/version: '$version'/" -e "s/^    source-tag: .*/    source-tag: v$version/" \
            packaging/snap/snapcraft.yaml > snapcraft.yaml
          grep -q "source-tag: v$version$" snapcraft.yaml
          case "$version" in *-*) channel=candidate ;; *) channel=stable ;; esac
          echo "channel=${CHANNEL:-$channel}" >> "$GITHUB_OUTPUT"
      - uses: snapcore/action-build@v1
        id: build
      - uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: ${{ steps.version.outputs.channel }}
